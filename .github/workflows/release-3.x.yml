name: GDNative
on: workflow_dispatch

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - identifier: Linux
            name: Linux
            runner: ubuntu-latest
            platform: linux
            arch: x86_64

          - identifier: Windows
            name: Windows
            runner: windows-latest
            platform: windows
            arch: x86_64

          - identifier: macOS
            name: macOS
            runner: macos-latest
            platform: macos
            arch: universal

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup python and scons
        uses: ./.github/actions/scons

      - name: Setup MSVC
        if: ${{ startsWith(matrix.identifier, 'Windows') }}
        uses: ./.github/actions/msvc

      - name: Compile
        run: |
          cd 3.x
          scons target=release platform='${{ matrix.platform }}' arch='${{ matrix.arch }}' -j2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.platform }}
          path: ${{ github.workspace }}/3.x/project/
  combine-artifacts:
    name: Combine
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download and merge the artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: artifacts