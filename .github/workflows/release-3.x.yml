name: Build macOS Catalina Release

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  build:
    runs-on: macos-10.15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install SCons
        run: |
          python3 -m pip install --upgrade pip
          pip3 install scons

      - name: Build release
        run: |
          cd 3.x
          scons target=release

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: gdmpt-macos-release
          path: 3.x/project/bin
